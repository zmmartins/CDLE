# Spark settings for every Lab 4 job (spark-submit and the SparkSession in pytest read this file).
# The cluster: a standalone master and 4 workers, each lending 1 core and 768 MB to one executor.
spark.master                        spark://spark-master:7077
spark.driver.memory                 1g
spark.executor.memory               768m
spark.executor.cores                1
spark.python.worker.memory          256m

# Every application writes an event log, so that the history server (http://localhost:18080)
# can show its jobs, stages and tasks after it has finished.
spark.eventLog.enabled              true
spark.eventLog.dir                  file:/data/events
spark.history.fs.logDirectory       file:/data/events
spark.history.fs.update.interval    3s

# The driver runs in the client container, and its UI (http://localhost:4040) only lives while the job runs.
spark.ui.showConsoleProgress        false
spark.driver.host                   client
# A lost worker is declared dead after 15 s instead of 60 s (Part B.4).
spark.worker.timeout                15
