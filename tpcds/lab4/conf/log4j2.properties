# Spark's own messages: warnings and errors only, so that the lab's output stays readable.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n
# Keep the lines that show a lost executor and the tasks that are run again (Part B.4).
logger.tsm.name = org.apache.spark.scheduler.TaskSetManager
logger.tsm.level = warn
logger.dag.name = org.apache.spark.scheduler.DAGScheduler
logger.dag.level = warn
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
# A worker killed on purpose (Part B.4) closes its connections: one line is enough, not a stack trace.
logger.tch.name = org.apache.spark.network.server.TransportChannelHandler
logger.tch.level = error
logger.trc.name = org.apache.spark.network.client.TransportResponseHandler
logger.trc.level = error
